name: CI

# labelle-imgui had no CI at all: a P1 (the sokol double-apply) reached a
# release candidate, and the bgfx bridge's API 161 port was only ever built
# locally. Runs on every push (a workflow added in a PR only gates via `push`
# until it lands on main) and on PRs targeting main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Checkout + one public-API read (the pins job) need nothing more.
permissions:
  contents: read

jobs:
  # The root package: build + unit tests.
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      # `test` also compiles the adapter (src/adapter_compile_check.zig):
      # nothing else in this repo imports it.
      - name: Build + test (+ adapter compile check)
        run: zig build test --summary all

  # Each bridge is its own package; build all three so an upstream API change
  # (e.g. a bgfx API bump) fails here, not in a game. The bgfx and sokol
  # bridges also have unit tests.
  bridges:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bridge: [bgfx, raylib, sokol]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - name: Install native deps (raylib/sokol/bgfx)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libxrender-dev libwayland-dev libxkbcommon-dev libasound2-dev
      - name: Build bridges/${{ matrix.bridge }}
        working-directory: bridges/${{ matrix.bridge }}
        run: zig build --summary all
      - name: Test bridges/${{ matrix.bridge }}
        if: matrix.bridge != 'raylib'
        working-directory: bridges/${{ matrix.bridge }}
        run: zig build test --summary all

  # The bgfx and sokol bridges on wasm honour a valid EMSDK and never
  # activate an emsdk Zig package (bgfx: labelle-imgui#37, same as
  # labelle-bgfx#159; sokol: #39, which also drops sokol-zig's own
  # install/activate steps from sokol_clib). labelle-web 0.3's provider
  # installs its own emsdk and exports EMSDK, EM_CONFIG and PATH; before
  # these fixes the build still ran `emsdk install/activate latest` on a
  # package copy, a second ~1.5 GB download per cold runner. Asserts the
  # MECHANISM, not only a green build:
  #   1. `-Demsdk_expect` fails the configure unless the named source was
  #      chosen: with EMSDK unset it must pick the package (and refuse
  #      `external`); with a valid EMSDK it must refuse `package`;
  #   2. the build summary shows no `emsdk install/activate (zig-pkg emsdk)`;
  #   3. no emsdk package under zig-pkg/ was installed or activated (no
  #      `upstream/`, no `.emscripten`). zig-pkg is not cached here.
  bridge-wasm-external-emsdk:
    name: ${{ matrix.bridge }}-bridge-wasm-external-emsdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bridge: [bgfx, sokol]
    env:
      EXT_EMSDK_VERSION: 4.0.9
    defaults:
      run:
        working-directory: bridges/${{ matrix.bridge }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      # EMSDK unset: configure-only (`--help` runs build() but no steps), so
      # this pins the fallback choice without the package's 1.5 GB install.
      - name: EMSDK unset picks the emsdk package
        env:
          EMSDK: ''
        run: |
          set -uo pipefail
          zig build -Dtarget=wasm32-emscripten -Demsdk_expect=package --help > /dev/null \
            || { echo "FAIL: EMSDK unset did not pick the emsdk package"; exit 1; }
          if zig build -Dtarget=wasm32-emscripten -Demsdk_expect=external --help > gate.log 2>&1; then
            echo "FAIL: -Demsdk_expect=external passed with EMSDK unset"
            exit 1
          fi
          grep -F "the emsdk Zig package was chosen" gate.log \
            || { cat gate.log; echo "FAIL: expect=external failed for another reason"; exit 1; }
      - name: Cache the external emsdk
        id: ext-emsdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/ext-emsdk
          key: ext-emsdk-${{ runner.os }}-${{ env.EXT_EMSDK_VERSION }}
      # A plain emsdk checkout, installed + activated: the layout labelle-web's
      # provider hands the build (`upstream/emscripten` + `.emscripten`).
      - name: Install the external emsdk
        if: steps.ext-emsdk-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$EXT_EMSDK_VERSION" https://github.com/emscripten-core/emsdk ~/ext-emsdk
          cd ~/ext-emsdk
          ./emsdk install "$EXT_EMSDK_VERSION"
          ./emsdk activate "$EXT_EMSDK_VERSION"
      # labelle-web 0.3's env contract: EMSDK, EM_CONFIG, PATH += upstream/emscripten.
      - name: Export EMSDK, EM_CONFIG and PATH
        run: |
          set -euo pipefail
          root="$HOME/ext-emsdk"
          test -d "$root/upstream/emscripten"
          test -f "$root/.emscripten"
          echo "EMSDK=$root" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$root/.emscripten" >> "$GITHUB_ENV"
          echo "$root/upstream/emscripten" >> "$GITHUB_PATH"
      - name: A valid EMSDK refuses expect=package
        run: |
          set -uo pipefail
          if zig build -Dtarget=wasm32-emscripten -Demsdk_expect=package --help > gate.log 2>&1; then
            echo "FAIL: -Demsdk_expect=package passed with a valid EMSDK set"
            exit 1
          fi
          grep -F "a valid EMSDK was found and used" gate.log \
            || { cat gate.log; echo "FAIL: expect=package failed for another reason"; exit 1; }
      - name: Build the bridge for wasm from the external EMSDK
        run: |
          set -uo pipefail
          zig build -Dtarget=wasm32-emscripten -Demsdk_expect=external --summary all > build.log 2>&1
          status=$?
          cat build.log
          [ "$status" -eq 0 ] || { echo "FAIL: build exited $status"; exit 1; }
          archive="zig-out/lib/lib${{ matrix.bridge }}_imgui_bridge.a"
          [ -s "$archive" ] || { echo "FAIL: no bridge archive at $archive"; exit 1; }
      - name: Assert no zig-pkg emsdk install/activate ran
        run: |
          set -euo pipefail
          if grep -F "(zig-pkg emsdk)" build.log; then
            echo "FAIL: the build ran emsdk install/activate on the zig-pkg emsdk"
            exit 1
          fi
          fail=0
          seen=0
          shopt -s nullglob
          for dir in zig-pkg/*/; do
            [ -f "$dir/emsdk.py" ] || continue
            seen=$((seen + 1))
            echo "emsdk package present (fetched, not necessarily used): $dir"
            for marker in upstream .emscripten; do
              if [ -e "$dir$marker" ]; then
                echo "FAIL: $dir$marker exists: the package emsdk was installed/activated"
                fail=1
              fi
            done
          done
          # sokol-zig's emsdk dependency is not lazy, so it is always fetched:
          # the check above must have looked at it, or it proved nothing.
          if [ "${{ matrix.bridge }}" = sokol ] && [ "$seen" -eq 0 ]; then
            echo "FAIL: sokol-zig's emsdk package was not found under zig-pkg/"
            fail=1
          fi
          exit $fail
      # #41: sokol_clib and cimgui must compile against EMSDK's sysroot ONLY,
      # not also sokol-zig's package sysroot. A fresh cache dir so the C/C++
      # compiles really run and --verbose-cc prints them.
      - name: sokol_clib + cimgui use only the external sysroot (#41)
        if: matrix.bridge == 'sokol'
        run: |
          set -uo pipefail
          zig build -Dtarget=wasm32-emscripten -Demsdk_expect=external \
            --cache-dir "$RUNNER_TEMP/cc-cache" --verbose-cc > cc.log 2>&1 \
            || { tail -50 cc.log; echo "FAIL: verbose build failed"; exit 1; }
          python3 ../../tools/check_cc_sysroot.py cc.log "$EMSDK/upstream/emscripten/cache/sysroot/include" sokol_gfx.c imgui.cpp

  # #41: with NO external EMSDK, the sokol bridge must use ONE emsdk, its own
  # `emsdk` package (the same pin as the game's root emsdk, which the game
  # links with), and never sokol-zig's different emsdk pin. Before #41 it
  # added the 4.0.9 sysroot behind sokol-zig's 5.0.x one, and only sokol-zig's
  # package was ever activated. Asserts:
  #   1. the bridge's emsdk package is installed + activated (its own setup
  #      steps ran, or a restored cache already had it);
  #   2. sokol-zig's emsdk package has no `upstream/` and no `.emscripten`;
  #   3. sokol_gfx.c and imgui.cpp compile with ONLY the bridge emsdk's
  #      sysroot as -isystem.
  sokol-bridge-wasm-package-emsdk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bridges/sokol
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      # The bridge's emsdk (installed + activated) is the expensive part.
      - name: Cache the bridge's emsdk package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bridges/sokol/zig-pkg
          key: sokol-bridge-zigpkg-${{ runner.os }}-${{ hashFiles('bridges/sokol/build.zig.zon') }}
      - name: Build the bridge for wasm from its emsdk package
        env:
          EMSDK: ''
        run: |
          set -uo pipefail
          zig build -Dtarget=wasm32-emscripten -Demsdk_expect=package \
            --cache-dir "$RUNNER_TEMP/cc-cache" --verbose-cc --summary all > build.log 2>&1
          status=$?
          grep -v -- " -isystem " build.log | tail -40
          [ "$status" -eq 0 ] || { tail -80 build.log; echo "FAIL: build exited $status"; exit 1; }
          [ -s zig-out/lib/libsokol_imgui_bridge.a ] || { echo "FAIL: no bridge archive"; exit 1; }
      - name: Only the bridge's emsdk was installed, and it provides the sysroot
        run: |
          set -euo pipefail
          own_hash=$(python3 -c "import re;t=open('build.zig.zon').read();print(re.search(r'\.emsdk\s*=\s*\.\{.*?\.hash\s*=\s*\"([^\"]+)\"',t,re.S).group(1))")
          own="zig-pkg/$own_hash"
          echo "bridge emsdk package: $own"
          [ -d "$own/upstream/emscripten" ] || { echo "FAIL: the bridge's emsdk was not installed"; exit 1; }
          [ -f "$own/.emscripten" ] || { echo "FAIL: the bridge's emsdk was not activated"; exit 1; }
          fail=0
          seen=0
          shopt -s nullglob
          for dir in zig-pkg/*/; do
            [ -f "$dir/emsdk.py" ] || continue
            [ "${dir%/}" = "$own" ] && continue
            seen=$((seen + 1))
            echo "other emsdk package (sokol-zig's): $dir"
            for marker in upstream .emscripten; do
              if [ -e "$dir$marker" ]; then
                echo "FAIL: $dir$marker exists: sokol-zig's emsdk was installed/activated"
                fail=1
              fi
            done
          done
          [ "$seen" -gt 0 ] || { echo "FAIL: sokol-zig's emsdk package not found, so check 2 proved nothing"; fail=1; }
          python3 ../../tools/check_cc_sysroot.py build.log "$own/upstream/emscripten/cache/sysroot/include" sokol_gfx.c imgui.cpp || fail=1
          exit $fail

  # Pins that must agree across packages/repos (every shared dependency:
  # cimgui, sokol, emsdk, ...), or a game links two copies of a
  # dependency (see tools/check_pins.py). Each package builds fine on its own
  # when these drift, so only this check catches it.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shared pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_pins.py
      # The bgfx and sokol bridges each carry a copy of the emsdk selection
      # helper (#37, #39); a fix to one must reach the other.
      - name: emsdk_source.zig copies are identical
        run: cmp bridges/bgfx/emsdk_source.zig bridges/sokol/emsdk_source.zig
